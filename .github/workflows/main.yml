name: Build Wf
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war
      
      - name: Notify if the build fails
        if: failure()
        run: echo "Build failed, check the logs"



  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Maven Build
        if: github.refs == 'refs/heads/main'
        run: mvn test
      

      - name: checkstyle
        if: github.refs == 'refs/heads/main'
        run: mvn checkstyle:checkstyle
      
      - name: if the build fails
        if: github.refs != 'refs/heads/main'
        run: echo "Skipping unit test and code analysis"

  Security_scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run trivity file system scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: 0
          vuln-type: 'os,library'
          output: trivy-results.json
      

      - name: upload trivy scan results as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy scan results
          path: trivy-results.json