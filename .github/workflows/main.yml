name: Build Wf
on:
  push:
    branches:
      - main
  push_request:
    branches:
      - feature

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Maven Build
        run: mvn install


  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Maven Build
        run: mvn test
      

      - name: checkstyle
        run: mvn checkstyle:checkstyle
