name: Build Wf
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Maven Build
        run: mvn install

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war
      
      - name: Notify if the build fails
        if: failure()
        run: echo "Build failed, check the logs"



  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Maven Build
        if: github.refs == "refs/heads/main"
        run: mvn test
      

      - name: checkstyle
        if: github.refs == "refs/heads/main"
        run: mvn checkstyle:checkstyle
      
      - name: if the build fails
        if: github.refs != "refs/heads/main"
        run: echo "Skipping unit test and code analysis"
